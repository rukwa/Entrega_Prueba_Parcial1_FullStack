<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GasPro | Productos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="site-header"></div>
<main class="container my-5">
  <h1 class="mb-4" style="color:var(--primary-dark);font-weight:800;">Productos</h1>
  <div class="mb-4">
    <select id="filtroCategoria" class="form-select w-auto d-inline-block">
      <option value="">Todas las categorías</option>
    </select>
  </div>
  <div class="row g-4" id="lista-productos"></div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/validations.js"></script>
<script>
  renderHeader('productos'); renderFooter();

  const categorias = [...new Set(productos.map(p=>p.categoria))];
  const filtro = document.getElementById('filtroCategoria');
  categorias.forEach(c => filtro.innerHTML += `<option value="${c}">${c}</option>`);

  function pintarProductos(lista){
    const cont = document.getElementById('lista-productos');
    cont.innerHTML = '';
    lista.forEach(p=>{
      const critico = p.stock <= p.stockCritico;
      cont.innerHTML += `
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card card-producto">
          <div class="icono-wrap">${mediaProducto(p)}</div>
          <div class="card-body">
            <span class="badge badge-categoria mb-2">${p.categoria}</span>
            ${critico ? '<span class="badge badge-critico mb-2">Stock crítico</span>' : ''}
            <h6 class="fw-bold">${p.nombre}</h6>
            <p class="small text-muted mb-1">${p.descripcion}</p>
            <p class="text-primary fw-bold mb-2">$${p.precioResidencial.toLocaleString('es-CL')} <span class="text-muted small fw-normal">/ ${p.unidad}</span></p>
            <a href="DetalleProductos.html?codigo=${p.codigo}" class="btn btn-sm btn-outline-secondary w-100 mb-1">Ver detalle</a>
            <button class="btn btn-sm btn-accent w-100" onclick="agregarAlCarrito('${p.codigo}')">Añadir al carrito</button>
          </div>
        </div>
      </div>`;
    });
  }
  pintarProductos(productos);
  filtro.addEventListener('change', ()=>{
    pintarProductos(filtro.value ? productos.filter(p=>p.categoria===filtro.value) : productos);
  });
</script>
</body>
</html>
