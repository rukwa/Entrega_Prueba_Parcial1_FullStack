<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GasPro | Admin - Usuarios</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>body{padding-top:0;}</style>
</head>
<body>
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <section class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 style="color:var(--primary-dark);font-weight:800;">Usuarios</h1>
      <a href="AdminUsuariosForma.html" class="btn btn-accent">+ Nuevo usuario</a>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead><tr><th>RUN</th><th>Nombre</th><th>Correo</th><th>Tipo</th><th>Acciones</th></tr></thead>
        <tbody id="tabla-usuarios"></tbody>
      </table>
    </div>
  </section>
</div>
<div class="modal fade" id="modalMostrarUsuario" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Detalle del usuario</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="modal-body-usuario"></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script>
  if(!exigirSesionAdmin(['Administrador'])) throw new Error('Sin sesión');
  renderAdminSidebar('usuarios');
  const tbody = document.getElementById('tabla-usuarios');
  obtenerUsuarios().forEach(u=>{
    tbody.innerHTML += `
    <tr>
      <td>${u.run}</td><td>${u.nombre} ${u.apellidos}</td><td>${u.correo}</td><td>${u.tipo}</td>
      <td>
        <button class="btn btn-sm btn-outline-secondary" onclick="mostrarUsuario('${u.run}')">Ver</button>
        <a href="AdminUsuariosForma.html?run=${u.run}" class="btn btn-sm btn-outline-primary">Editar</a>
      </td>
    </tr>`;
  });
  function mostrarUsuario(run){
    const u = obtenerUsuarios().find(x=>x.run===run);
    document.getElementById('modal-body-usuario').innerHTML = `
      <p><strong>RUN:</strong> ${u.run}</p>
      <p><strong>Nombre:</strong> ${u.nombre} ${u.apellidos}</p>
      <p><strong>Correo:</strong> ${u.correo}</p>
      <p><strong>Tipo:</strong> ${u.tipo}</p>
      <p><strong>Ubicación:</strong> ${u.comuna}, ${u.region}</p>
      <p><strong>Dirección:</strong> ${u.direccion}</p>`;
    new bootstrap.Modal(document.getElementById('modalMostrarUsuario')).show();
  }
</script>
</body>
</html>
