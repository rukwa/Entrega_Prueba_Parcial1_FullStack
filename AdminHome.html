<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GasPro | Carrito de compras</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="site-header"></div>
<main class="container my-5">
  <h1 class="mb-4" style="color:var(--primary-dark);font-weight:800;">Mi carrito de compras</h1>
  <div class="row g-4">
    <div class="col-md-8" id="lista-carrito"></div>
    <div class="col-md-4">
      <div class="card p-4">
        <h5>Resumen</h5>
        <div class="d-flex justify-content-between fs-5 fw-bold mt-3"><span>Total</span><span id="total-carrito">$0</span></div>
        <div class="mt-3">
          <label class="form-label small">Cupón de descuento</label>
          <div class="input-group"><input type="text" class="form-control" placeholder="Código"><button class="btn btn-outline-secondary">Aplicar</button></div>
        </div>
        <button class="btn btn-accent w-100 mt-3">Pagar</button>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script>
  renderHeader('carrito'); renderFooter();

  function renderCarrito(){
    const carrito = obtenerCarrito();
    const cont = document.getElementById('lista-carrito');
    if(carrito.length === 0){ cont.innerHTML = '<p class="text-muted">Tu carrito está vacío. <a href="Productos.html">Ver productos</a></p>'; document.getElementById('total-carrito').textContent = '$0'; return; }
    cont.innerHTML = '';
    let total = 0;
    carrito.forEach(item=>{
      const p = productos.find(x=>x.codigo===item.codigo);
      if(!p) return;
      const subtotal = p.precioResidencial * item.cantidad;
      total += subtotal;
      cont.innerHTML += `
      <div class="carrito-item d-flex align-items-center gap-3">
        <div style="width:60px;height:60px;">${mediaProducto(p)}</div>
        <div class="flex-grow-1">
          <h6 class="mb-0 fw-bold">${p.nombre}</h6>
          <span class="text-muted small">$${p.precioResidencial.toLocaleString('es-CL')} c/u</span>
        </div>
        <button class="btn btn-outline-secondary qty-btn" onclick="cambiarCantidad('${p.codigo}',-1)">-</button>
        <span>${item.cantidad}</span>
        <button class="btn btn-outline-secondary qty-btn" onclick="cambiarCantidad('${p.codigo}',1)">+</button>
        <strong class="ms-2">$${subtotal.toLocaleString('es-CL')}</strong>
        <button class="btn btn-sm btn-outline-danger ms-2" onclick="quitarDelCarrito('${p.codigo}')">✕</button>
      </div>`;
    });
    document.getElementById('total-carrito').textContent = '$' + total.toLocaleString('es-CL');
  }
  function cambiarCantidad(codigo, delta){
    const carrito = obtenerCarrito();
    const item = carrito.find(i=>i.codigo===codigo);
    if(!item) return;
    item.cantidad = Math.max(1, item.cantidad + delta);
    guardarCarrito(carrito);
    renderCarrito();
  }
  function quitarDelCarrito(codigo){
    guardarCarrito(obtenerCarrito().filter(i=>i.codigo!==codigo));
    renderCarrito();
  }
  renderCarrito();
</script>
</body>
</html>
