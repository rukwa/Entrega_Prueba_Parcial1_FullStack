<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GasPro | Administrador</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>body{padding-top:0;}</style>
</head>
<body>
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <section class="admin-content">
    <h1 class="mb-4" style="color:var(--primary-dark);font-weight:800;">¡Hola, Administrador! 👋</h1>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-4 text-center">
          <h2 class="fw-bold" style="color:var(--primary);" id="stat-productos"></h2>
          <span class="text-muted">Productos</span>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-4 text-center">
          <h2 class="fw-bold" style="color:var(--primary);" id="stat-usuarios"></h2>
          <span class="text-muted">Usuarios</span>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-4 text-center">
          <h2 class="fw-bold" style="color:var(--danger);" id="stat-criticos"></h2>
          <span class="text-muted">Productos con stock crítico</span>
        </div>
      </div>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script>
  const sesion = exigirSesionAdmin();
  if(sesion){
    renderAdminSidebar('home');
    document.querySelector('h1').textContent = `¡Hola, ${sesion.nombre}! 👋`;
    document.getElementById('stat-productos').textContent = productos.length;
    document.getElementById('stat-usuarios').textContent = obtenerUsuarios().length;
    document.getElementById('stat-criticos').textContent = productos.filter(p => p.stock <= p.stockCritico).length;
  }
</script>
</body>
</html>
