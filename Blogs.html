<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GasPro | Admin - Usuario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>body{padding-top:0;}</style>
</head>
<body>
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <section class="admin-content">
    <h1 class="mb-4" id="titulo-form" style="color:var(--primary-dark);font-weight:800;">Nuevo usuario</h1>
    <form id="formUsuario" class="row g-3" style="max-width:700px;" novalidate>
      <div class="col-md-6"><label class="form-label">RUN</label><input type="text" class="form-control" id="run" maxlength="9"><div class="invalid-feedback"></div></div>
      <div class="col-md-6"><label class="form-label">Nombre</label><input type="text" class="form-control" id="nombre" maxlength="50"><div class="invalid-feedback"></div></div>
      <div class="col-md-6"><label class="form-label">Apellidos</label><input type="text" class="form-control" id="apellidos" maxlength="100"><div class="invalid-feedback"></div></div>
      <div class="col-md-6"><label class="form-label">Correo</label><input type="text" class="form-control" id="correo" maxlength="100"><div class="invalid-feedback"></div></div>
      <div class="col-md-6">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="clave" maxlength="10">
        <div class="invalid-feedback"></div>
        <div class="form-text sugerencia" id="hint-clave">Entre 4 y 10 caracteres.</div>
      </div>
      <div class="col-md-6"><label class="form-label">Fecha de nacimiento (opcional)</label><input type="date" class="form-control" id="fecha"></div>
      <div class="col-md-6">
        <label class="form-label">Tipo de usuario</label>
        <select class="form-select" id="tipo"><option value="">-- Seleccione --</option><option>Administrador</option><option>Vendedor</option><option>Cliente</option></select>
        <div class="invalid-feedback"></div>
      </div>
      <div class="col-md-6"><label class="form-label">Región</label><select class="form-select" id="region"><option value="">-- Seleccione la región --</option></select></div>
      <div class="col-md-6"><label class="form-label">Comuna</label><select class="form-select" id="comuna"><option value="">-- Seleccione la comuna --</option></select></div>
      <div class="col-12"><label class="form-label">Dirección</label><input type="text" class="form-control" id="direccion" maxlength="300"><div class="invalid-feedback"></div></div>
      <div class="col-12 mt-3">
        <button type="submit" class="btn btn-accent">Guardar usuario</button>
        <a href="AdminUsuarios.html" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/validations.js"></script>
<script>
  if(!exigirSesionAdmin(['Administrador'])) throw new Error('Sin sesión');
  renderAdminSidebar('usuarios');
  const region=document.getElementById('region'), comuna=document.getElementById('comuna');
  Object.keys(regiones).forEach(r => region.innerHTML += `<option value="${r}">${r}</option>`);
  region.addEventListener('change', ()=>{
    comuna.innerHTML = '<option value="">-- Seleccione la comuna --</option>';
    (regiones[region.value]||[]).forEach(c => comuna.innerHTML += `<option value="${c}">${c}</option>`);
  });

  const params = new URLSearchParams(window.location.search);
  const runParam = params.get('run');
  const run=document.getElementById('run'), nombre=document.getElementById('nombre'), apellidos=document.getElementById('apellidos'),
        correo=document.getElementById('correo'), clave=document.getElementById('clave'),
        tipo=document.getElementById('tipo'), direccion=document.getElementById('direccion');

  if(runParam){
    const u = obtenerUsuarios().find(x=>x.run===runParam);
    if(u){
      document.getElementById('titulo-form').textContent = 'Editar usuario';
      run.value=u.run; run.disabled=true; nombre.value=u.nombre; apellidos.value=u.apellidos;
      correo.value=u.correo; tipo.value=u.tipo; direccion.value=u.direccion;
      region.value=u.region; region.dispatchEvent(new Event('change')); comuna.value=u.comuna;
      document.getElementById('hint-clave').textContent = 'Deja este campo vacío para mantener la contraseña actual.';
    }
  }

  function valRun(){ if(!validarRut(run.value)){ marcarInvalido(run,'RUN inválido (sin puntos ni guión, ej: 19011022K).'); return false;} marcarValido(run); return true; }
  function valNombre(){ if(nombre.value.trim()===''||nombre.value.length>50){ marcarInvalido(nombre,'Requerido, máximo 50 caracteres.'); return false;} marcarValido(nombre); return true; }
  function valApellidos(){ if(apellidos.value.trim()===''||apellidos.value.length>100){ marcarInvalido(apellidos,'Requerido, máximo 100 caracteres.'); return false;} marcarValido(apellidos); return true; }
  function valCorreo(){ if(!validarCorreo(correo.value)||correo.value.length>100){ marcarInvalido(correo,'Correo inválido o dominio no permitido.'); return false;} marcarValido(correo); return true; }
  function valClave(){
    // Al editar, dejar en blanco es válido (mantiene la clave actual). Al crear, es obligatoria.
    if(clave.value === '' && runParam){ marcarValido(clave); return true; }
    if(clave.value.length<4 || clave.value.length>10){ marcarInvalido(clave,'Entre 4 y 10 caracteres.'); return false; }
    marcarValido(clave); return true;
  }
  function valTipo(){ if(tipo.value===''){ marcarInvalido(tipo,'Seleccione un tipo de usuario.'); return false;} marcarValido(tipo); return true; }
  function valDireccion(){ if(direccion.value.trim()===''||direccion.value.length>300){ marcarInvalido(direccion,'Requerido, máximo 300 caracteres.'); return false;} marcarValido(direccion); return true; }

  [[run,valRun],[nombre,valNombre],[apellidos,valApellidos],[correo,valCorreo],[clave,valClave],[tipo,valTipo],[direccion,valDireccion]]
   .forEach(([el,fn])=> el.addEventListener('input', fn));

  document.getElementById('formUsuario').addEventListener('submit', function(e){
    e.preventDefault();
    const ok = [valRun(),valNombre(),valApellidos(),valCorreo(),valClave(),valTipo(),valDireccion()].every(Boolean);
    if(!ok) return;

    if(runParam){
      // Editar usuario existente
      const anterior = obtenerUsuarios().find(u=>u.run===runParam);
      actualizarUsuario(runParam, {
        nombre: nombre.value.trim(), apellidos: apellidos.value.trim(),
        correo: correo.value.trim(), tipo: tipo.value,
        region: region.value, comuna: comuna.value, direccion: direccion.value.trim(),
        clave: clave.value !== '' ? clave.value : anterior.clave
      });
    } else {
      // Crear usuario nuevo
      if(obtenerUsuarios().some(u=>u.run===run.value.trim())){
        marcarInvalido(run,'Ya existe un usuario con ese RUN.'); return;
      }
      if(buscarUsuarioPorCorreo(correo.value)){
        marcarInvalido(correo,'Ya existe un usuario con ese correo.'); return;
      }
      registrarUsuario({
        run: run.value.trim(), nombre: nombre.value.trim(), apellidos: apellidos.value.trim(),
        correo: correo.value.trim(), clave: clave.value, tipo: tipo.value,
        region: region.value, comuna: comuna.value, direccion: direccion.value.trim()
      });
    }
    mostrarToast('Usuario guardado con éxito');
    setTimeout(()=>window.location.href='AdminUsuarios.html',1200);
  });
</script>
</body>
</html>
