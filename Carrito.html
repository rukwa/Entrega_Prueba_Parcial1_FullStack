<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GasPro | Iniciar sesión</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="site-header"></div>
<main class="container my-5 d-flex justify-content-center">
  <div class="col-md-5">
    <div class="card card-form">
      <div class="card-header text-center py-3">🔥 Iniciar sesión</div>
      <div class="card-body p-4">
        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="text" class="form-control" id="correo" maxlength="100">
            <div class="invalid-feedback"></div>
            <div class="form-text sugerencia">Solo correos @duoc.cl, @profesor.duoc.cl o @gmail.com</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="clave" maxlength="10">
            <div class="invalid-feedback"></div>
            <div class="form-text sugerencia">Entre 4 y 10 caracteres</div>
          </div>
          <button type="submit" class="btn btn-accent w-100">Iniciar sesión</button>
          <p class="text-center small mt-3 mb-0">¿No tienes cuenta? <a href="Registro.html">Regístrate aquí</a></p>
        </form>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/validations.js"></script>
<script>
  renderHeader('login'); renderFooter();

  const correo = document.getElementById('correo');
  const clave  = document.getElementById('clave');

  function validarCampoCorreo(){
    if(correo.value.trim()===''){ marcarInvalido(correo,'El correo es obligatorio.'); return false; }
    if(!validarCorreo(correo.value)){ marcarInvalido(correo,'Usa un correo @duoc.cl, @profesor.duoc.cl o @gmail.com.'); return false; }
    marcarValido(correo); return true;
  }
  function validarCampoClave(){
    if(clave.value.trim()===''){ marcarInvalido(clave,'La contraseña es obligatoria.'); return false; }
    if(clave.value.length<4 || clave.value.length>10){ marcarInvalido(clave,'Debe tener entre 4 y 10 caracteres.'); return false; }
    marcarValido(clave); return true;
  }

  correo.addEventListener('input', validarCampoCorreo);
  clave.addEventListener('input', validarCampoClave);

  document.getElementById('formLogin').addEventListener('submit', function(e){
    e.preventDefault();
    const ok1 = validarCampoCorreo(), ok2 = validarCampoClave();
    if(!(ok1 && ok2)) return;

    const usuario = buscarUsuarioPorCorreo(correo.value);
    if(!usuario || usuario.clave !== clave.value){
      marcarInvalido(correo, 'Correo o contraseña incorrectos.');
      marcarInvalido(clave, 'Correo o contraseña incorrectos.');
      return;
    }

    iniciarSesion(usuario);
    mostrarToast(`¡Bienvenido/a, ${usuario.nombre}!`);
    setTimeout(() => redirigirSegunTipo(usuario.tipo), 900);
  });
</script>
</body>
</html>
