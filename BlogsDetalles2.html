<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GasPro | Contacto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="site-header"></div>
<main class="container my-5 d-flex justify-content-center">
  <div class="col-md-6">
    <div class="card card-form">
      <div class="card-header text-center py-3">🔥 Formulario de contacto</div>
      <div class="card-body p-4">
        <form id="formContacto" novalidate>
          <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" maxlength="100">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="text" class="form-control" id="correo" maxlength="100">
            <div class="invalid-feedback"></div>
            <div class="form-text sugerencia">@duoc.cl, @profesor.duoc.cl o @gmail.com</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="4" maxlength="500"></textarea>
            <div class="invalid-feedback"></div>
            <div class="form-text sugerencia">0/500 caracteres</div>
          </div>
          <button type="submit" class="btn btn-accent w-100">Enviar mensaje</button>
        </form>
      </div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/validations.js"></script>
<script>
  renderHeader('contacto'); renderFooter();
  const nombre=document.getElementById('nombre'), correo=document.getElementById('correo'), mensaje=document.getElementById('mensaje');

  function valNombre(){ if(nombre.value.trim()===''||nombre.value.length>100){ marcarInvalido(nombre,'Requerido, máximo 100 caracteres.'); return false;} marcarValido(nombre); return true; }
  function valCorreo(){ if(correo.value.length>100||!validarCorreo(correo.value)){ marcarInvalido(correo,'Correo inválido o dominio no permitido.'); return false;} marcarValido(correo); return true; }
  function valMensaje(){ contadorCaracteres(mensaje,500); if(mensaje.value.trim()===''||mensaje.value.length>500){ marcarInvalido(mensaje,'Requerido, máximo 500 caracteres.'); return false;} marcarValido(mensaje); return true; }

  nombre.addEventListener('input', valNombre);
  correo.addEventListener('input', valCorreo);
  mensaje.addEventListener('input', valMensaje);

  document.getElementById('formContacto').addEventListener('submit', function(e){
    e.preventDefault();
    if(valNombre() & valCorreo() & valMensaje()) mostrarToast('Mensaje enviado con éxito');
  });
</script>
</body>
</html>
