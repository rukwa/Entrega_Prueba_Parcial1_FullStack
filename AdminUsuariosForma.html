<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gas El Volcán | Admin - Producto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>body{padding-top:0;}</style>
</head>
<body>
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <section class="admin-content">
    <h1 class="mb-4" id="titulo-form" style="color:var(--primary-dark);font-weight:800;">Nuevo producto</h1>
    <form id="formProducto" class="row g-3" style="max-width:700px;" novalidate>
      <div class="col-md-6">
        <label class="form-label">Código producto</label>
        <input type="text" class="form-control" id="codigo" minlength="3">
        <div class="invalid-feedback"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" maxlength="100">
        <div class="invalid-feedback"></div>
      </div>
      <div class="col-12">
        <label class="form-label">Descripción (opcional)</label>
        <textarea class="form-control" id="descripcion" maxlength="500" rows="3"></textarea>
        <div class="invalid-feedback"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Precio</label>
        <input type="number" class="form-control" id="precio" min="0" step="0.01">
        <div class="invalid-feedback"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Stock</label>
        <input type="number" class="form-control" id="stock" min="0" step="1">
        <div class="invalid-feedback"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Stock crítico (opcional)</label>
        <input type="number" class="form-control" id="stockCritico" min="0" step="1">
        <div class="invalid-feedback"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label">Categoría</label>
        <select class="form-select" id="categoria">
          <option value="">-- Seleccione --</option>
          <option>Cilindros de Gas</option><option>Reguladores</option>
          <option>Mangueras y Conexiones</option><option>Accesorios</option>
        </select>
        <div class="invalid-feedback"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label">Imagen (opcional)</label>
        <input type="file" class="form-control" id="imagen">
      </div>
      <div class="col-12 mt-3">
        <button type="submit" class="btn btn-accent">Guardar producto</button>
        <a href="AdminProductos.html" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/validations.js"></script>
<script>
  if(!exigirSesionAdmin()) throw new Error('Sin sesión');
  renderAdminSidebar('productos');
  const params = new URLSearchParams(window.location.search);
  const codigoParam = params.get('codigo');
  const codigo=document.getElementById('codigo'), nombre=document.getElementById('nombre'),
        descripcion=document.getElementById('descripcion'), precio=document.getElementById('precio'),
        stock=document.getElementById('stock'), stockCritico=document.getElementById('stockCritico'),
        categoria=document.getElementById('categoria');

  if(codigoParam){
    const p = productos.find(x=>x.codigo===codigoParam);
    if(p){
      document.getElementById('titulo-form').textContent = 'Editar producto';
      codigo.value=p.codigo; codigo.disabled=true; nombre.value=p.nombre;
      descripcion.value=p.descripcion; precio.value=p.precioResidencial;
      stock.value=p.stock; stockCritico.value=p.stockCritico; categoria.value=p.categoria;
    }
  }

  function valCodigo(){ if(codigo.value.trim().length<3){ marcarInvalido(codigo,'Requerido, mínimo 3 caracteres.'); return false;} marcarValido(codigo); return true; }
  function valNombre(){ if(nombre.value.trim()===''||nombre.value.length>100){ marcarInvalido(nombre,'Requerido, máximo 100 caracteres.'); return false;} marcarValido(nombre); return true; }
  function valDescripcion(){ contadorCaracteres(descripcion,500); if(descripcion.value.length>500){ marcarInvalido(descripcion,'Máximo 500 caracteres.'); return false;} marcarValido(descripcion); return true; }
  function valPrecio(){ if(precio.value===''||parseFloat(precio.value)<0){ marcarInvalido(precio,'Requerido, no puede ser negativo (0 = producto FREE).'); return false;} marcarValido(precio); return true; }
  function valStock(){ if(stock.value===''||parseInt(stock.value)<0||!Number.isInteger(parseFloat(stock.value))){ marcarInvalido(stock,'Requerido, entero mayor o igual a 0.'); return false;} marcarValido(stock); return true; }
  function valStockCritico(){ if(stockCritico.value!=='' && (parseInt(stockCritico.value)<0||!Number.isInteger(parseFloat(stockCritico.value)))){ marcarInvalido(stockCritico,'Debe ser un entero mayor o igual a 0.'); return false;} marcarValido(stockCritico); return true; }
  function valCategoria(){ if(categoria.value===''){ marcarInvalido(categoria,'Seleccione una categoría.'); return false;} marcarValido(categoria); return true; }

  [[codigo,valCodigo],[nombre,valNombre],[descripcion,valDescripcion],[precio,valPrecio],
   [stock,valStock],[stockCritico,valStockCritico],[categoria,valCategoria]]
   .forEach(([el,fn])=> el.addEventListener('input', fn));

  document.getElementById('formProducto').addEventListener('submit', function(e){
    e.preventDefault();
    const ok = [valCodigo(),valNombre(),valDescripcion(),valPrecio(),valStock(),valStockCritico(),valCategoria()].every(Boolean);
    if(ok){ mostrarToast('Producto guardado con éxito'); setTimeout(()=>window.location.href='AdminProductos.html',1200); }
  });
</script>
</body>
</html>
