<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GasPro | Admin - Productos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>body{padding-top:0;}</style>
</head>
<body>
<div class="admin-wrapper">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <section class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 style="color:var(--primary-dark);font-weight:800;">Productos</h1>
      <a href="AdminProductosForma.html" class="btn btn-accent">+ Nuevo producto</a>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
        <tbody id="tabla-productos"></tbody>
      </table>
    </div>
  </section>
</div>

<!-- Modal Mostrar producto -->
<div class="modal fade" id="modalMostrar" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Detalle del producto</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="modal-body-producto"></div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script>
  if(!exigirSesionAdmin()) throw new Error('Sin sesión');
  renderAdminSidebar('productos');
  const tbody = document.getElementById('tabla-productos');
  productos.forEach(p=>{
    const critico = p.stock <= p.stockCritico;
    tbody.innerHTML += `
    <tr>
      <td>${p.codigo}</td><td>${p.nombre}</td><td>${p.categoria}</td>
      <td>$${p.precioResidencial.toLocaleString('es-CL')}</td>
      <td>${p.stock} ${critico?'<span class="badge badge-critico">Crítico</span>':''}</td>
      <td>
        <button class="btn btn-sm btn-outline-secondary" onclick="mostrarProducto('${p.codigo}')">Ver</button>
        <a href="AdminProductosForma.html?codigo=${p.codigo}" class="btn btn-sm btn-outline-primary">Editar</a>
      </td>
    </tr>`;
  });
  function mostrarProducto(codigo){
    const p = productos.find(x=>x.codigo===codigo);
    document.getElementById('modal-body-producto').innerHTML = `
      <p><strong>Código:</strong> ${p.codigo}</p>
      <p><strong>Nombre:</strong> ${p.nombre}</p>
      <p><strong>Categoría:</strong> ${p.categoria}</p>
      <p><strong>Descripción:</strong> ${p.descripcion}</p>
      <p><strong>Precio residencial:</strong> $${p.precioResidencial.toLocaleString('es-CL')}</p>
      <p><strong>Precio comercial:</strong> $${p.precioComercial.toLocaleString('es-CL')}</p>
      <p><strong>Stock:</strong> ${p.stock} (crítico: ${p.stockCritico})</p>`;
    new bootstrap.Modal(document.getElementById('modalMostrar')).show();
  }
</script>
</body>
</html>
